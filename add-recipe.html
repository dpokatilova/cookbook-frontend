<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Додати рецепт — CookBook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CookBook</h1>
    <p><a class="button" href="index.html">До рецептів</a></p>
    <div id="auth-bar"></div>
  </header>

  <main>
    <h2>Новий рецепт</h2>
    <form id="recipe-form" class="form" novalidate>
      <label for="title">Назва *</label>
      <input type="text" id="title" maxlength="200">
      <p class="field-error" id="error-title"></p>

      <label for="description">Опис</label>
      <textarea id="description" rows="4"></textarea>
      <p class="field-error" id="error-description"></p>

      <label for="time_minutes">Час приготування, хв *</label>
      <input type="number" id="time_minutes" min="1">
      <p class="field-error" id="error-time_minutes"></p>

      <label for="calories">Калорії *</label>
      <input type="number" id="calories" min="0">
      <p class="field-error" id="error-calories"></p>

      <label for="category_id">Категорія *</label>
      <select id="category_id">
        <option value="">Оберіть категорію</option>
      </select>
      <p class="field-error" id="error-category_id"></p>

      <button type="submit" class="button">Додати</button>
    </form>

    <p id="message"></p>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="auth.js"></script>
  <script src="add-recipe.js"></script>
</body>
</html>
